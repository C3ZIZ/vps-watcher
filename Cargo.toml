[package]
name = "vps-watcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Abdulaziz Hafiz <abdulazizhafez2004@gmail.com>"]
description = "A tiny, fast, secure monitor for a single VPS: host, containers, services, logs and history."
license = "MIT"
repository = "https://github.com/C3ZIZ/vps-watcher"
readme = "README.md"
keywords = ["monitoring", "vps", "docker", "metrics", "dashboard"]
categories = ["command-line-utilities", "web-programming::http-server"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "service"] }
libc = "0.2.191"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "signal", "fs", "io-util", "sync", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

[dev-dependencies]
tempfile = "3.27.0"
