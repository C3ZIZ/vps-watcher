name: Release

# scripts/tag-release.sh publishes the GitHub Release; this attaches the binaries to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name }}
      TARGET: ${{ matrix.target }}
      ASSET: vps-watcher-${{ matrix.arch }}-linux
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup update stable && rustup default stable && rustup target add "$TARGET"
      - name: Build static binary
        run: VPSW_VERSION="$TAG" cargo build --release --locked --target "$TARGET"
      - name: Smoke test
        run: ./target/"$TARGET"/release/vps-watcher version
      - name: Upload
        run: |
          cp "target/$TARGET/release/vps-watcher" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  packaging:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Upload service, settings and installer
        run: gh release upload "$TAG" packaging/vps-watcher.service packaging/vps-watcher.env install.sh --clobber --repo "$GITHUB_REPOSITORY"
